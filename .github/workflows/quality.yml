name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production application image
        run: docker build --pull --file infra/Dockerfile --tag fjordpulse-app:ci .
      - name: Build production backup image
        run: docker build --pull --file infra/Dockerfile.backup --tag fjordpulse-backup:ci .
      - name: Verify production application runtime offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint frankenphp \
            fjordpulse-app:ci php-cli -r \
            'require "/app/backend/vendor/autoload.php"; exit(extension_loaded("intl") && extension_loaded("zip") && class_exists("FjordPulse\\Application") ? 0 : 1);'
          docker run --rm --network none --entrypoint /app/backend/bin/cake \
            fjordpulse-app:ci --help >/dev/null
      - name: Verify pinned backup tools offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /usr/local/bin/surreal \
            fjordpulse-backup:ci version
          docker run --rm --network none --entrypoint /usr/local/bin/restic \
            fjordpulse-backup:ci version

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install exact dependencies and browser
        run: make install
      - name: Install Chromium system dependencies
        run: PLAYWRIGHT_BROWSERS_PATH="$PWD/.tools/playwright" npx playwright install-deps chromium
      - name: Verify planning corpus
        run: make verify-planning
      - name: Typecheck
        run: make typecheck
      - name: PHPStan max
        run: make phpstan
      - name: Unit, integration, and contract tests
        run: make test
      - name: Production build
        run: make build
      - name: Browser black-box tests
        run: make e2e
      - name: Visual regression
        run: make visual
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
